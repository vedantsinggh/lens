services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: loanlens-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgrespassword}
      POSTGRES_DB: ${POSTGRES_DB:-loanlens_db}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - loanlens_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-loanlens_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  loanlens_pgdata:
    name: loanlens_pgdata
